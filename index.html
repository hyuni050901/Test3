<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>산업연관표 다각화 시뮬레이터</title>
    <link rel="stylesheet" href="style.css">
    <!-- Chart.js 및 Scatter plot 시각화 라이브러리 추가 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h1>산업연관표 분석 및 파급효과 시뮬레이터</h1>

    <!-- 컨셉 1: 부문 분류 다각화 (드롭다운) -->
    <section class="control-panel">
        <label for="sector-select"><b>분류 선택:</b></label>
        <select id="sector-select">
            <option value="basic" selected>기본부문 (380개)</option>
            <option value="small">소분류</option>
            <option value="medium">중분류</option>
            <option value="large">대분류</option>
        </select>
        <button id="btn-load">자료 불러오기</button>
    </section>

    <!-- 컨셉 2: 시나리오 핫키 패널 -->
    <section class="scenario-panel">
        <h3>💡 주요 시나리오 빠른 실행 (단위: 백만 원)</h3>
        <button class="btn-scenario" data-industry="반도체" data-value="10000000">K-반도체 10조 원 투자</button>
        <button class="btn-scenario" data-industry="자동차" data-value="5000000">친환경차 보조금 5조 원</button>
        <button class="btn-scenario" data-industry="건설" data-value="3000000">건설경기 부양 3조 원</button>
    </section>

    <!-- 시뮬레이션 입력 및 결과 -->
    <section class="simulation-section">
        <h2>수요충격 시뮬레이션</h2>
        <div id="input-container">
            <!-- 사용자 직접 입력창 영역 -->
        </div>
        <table id="result-table">
            <!-- 생산/수입/부가가치 유발액 결과 표 -->
        </table>
    </section>

    <!-- 컨셉 3: 전방·후방 연쇄효과 4분면 분석 맵 -->
    <section class="chart-section">
        <h2>산업별 영향력계수 vs 감응도계수 (4분면 분석)</h2>
        <p>※ 우상단: 전후방쇄형(중심산업), 좌상단: 전방쇄형(원자재형), 우하단: 후방쇄형(제조형)</p>
        <canvas id="linkageChart" width="600" height="400"></canvas>
    </section>

    <script src="app.js"></script>
</body>
</html>
